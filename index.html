<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Velvet Bean Cafe — Digital Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF7F2; color: #1F1A17; }
    .font-serif-display { font-family: 'Playfair Display', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; }
    }
  </style>
</head>
<body class="pb-28">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-[#1F1A17] text-[#FAF7F2] shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between gap-2">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-amber-400 text-lg">☕</span>
          <h1 class="font-serif-display text-lg sm:text-xl font-bold tracking-wide">The Velvet Bean Cafe</h1>
        </div>
        <p class="text-xs text-stone-300 mt-0.5 flex items-center gap-2">
          <span id="table-badge" class="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-medium">Table #01</span>
          <span>• Freshly Brewed Daily</span>
        </p>
      </div>

      <button onclick="openQrModal()" class="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-[#1F1A17] font-semibold text-xs sm:text-sm px-3.5 py-2 rounded-xl transition shadow-sm shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h6v6H3V3zm12 0h6v6h-6V3zM3 15h6v6H3v-6zm13 0h2v2h-2v-2zm3 0h2v2h-2v-2zm-3 3h2v3h-2v-3zm3 2h2v1h-2v-1z"/>
        </svg>
        <span>Menu QR Code</span>
      </button>
    </div>

    <!-- Search & Veg Filter Bar -->
    <div class="bg-[#29221E] px-4 py-2.5 border-t border-white/10">
      <div class="max-w-3xl mx-auto flex items-center gap-2.5">
        <div class="relative flex-1">
          <input id="search-input" type="text" oninput="renderMenu()" placeholder="Search espresso, croissant, pasta..."
            class="w-full bg-white/10 text-white placeholder-stone-400 text-sm rounded-xl pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
          <svg class="w-4 h-4 text-stone-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </div>
        <button id="veg-toggle" onclick="toggleVeg()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border border-stone-600 text-stone-200 transition shrink-0">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
          <span>Veg Only</span>
        </button>
      </div>
    </div>

    <!-- Category Pills -->
    <div class="bg-[#FAF7F2] text-[#1F1A17] border-b border-stone-200 px-4 py-2.5">
      <div id="category-tabs" class="max-w-3xl mx-auto flex gap-2 overflow-x-auto no-scrollbar"></div>
    </div>
  </header>

  <!-- Menu Items List -->
  <main class="max-w-3xl mx-auto px-4 pt-4">
    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
  </main>

  <!-- Floating Cart Bar -->
  <div id="cart-bar" class="fixed bottom-4 left-0 right-0 px-4 z-30 hidden">
    <div class="max-w-3xl mx-auto bg-[#1F1A17] text-white rounded-2xl p-3.5 shadow-xl flex items-center justify-between border border-amber-500/30">
      <div>
        <p class="text-xs text-amber-300 font-medium" id="cart-count-text">0 Items Selected</p>
        <p class="text-base font-bold" id="cart-total-text">₹0</p>
      </div>
      <button onclick="openCartModal()" class="bg-amber-500 hover:bg-amber-400 text-[#1F1A17] font-bold text-sm px-5 py-2.5 rounded-xl transition">
        View Tray & Order →
      </button>
    </div>
  </div>

  <!-- QR Code Modal -->
  <div id="qr-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl relative">
      <button onclick="closeQrModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
      <span class="text-xs font-bold uppercase tracking-widest text-amber-700 bg-amber-100 px-3 py-1 rounded-full">Scan For Menu</span>
      <h2 class="font-serif-display text-2xl font-bold mt-2 text-[#1F1A17]">The Velvet Bean Cafe</h2>
      <p class="text-xs text-stone-500 mt-1">Select Table Number for QR</p>

      <div class="mt-3 flex justify-center">
        <select id="qr-table-select" onchange="generateQR()" class="border border-stone-300 rounded-xl px-3 py-1.5 text-sm font-semibold bg-stone-50">
          <option value="01">Table #01</option>
          <option value="02">Table #02</option>
          <option value="03">Table #03</option>
          <option value="04">Table #04</option>
          <option value="05">Table #05</option>
          <option value="06">Table #06</option>
          <option value="07">Table #07</option>
          <option value="08">Table #08</option>
        </select>
      </div>

      <div id="print-area" class="my-5 flex flex-col items-center justify-center">
        <div id="qrcode-box" class="p-4 bg-white border-2 border-stone-200 rounded-2xl shadow-inner inline-block"></div>
        <p id="qr-label" class="mt-2.5 text-sm font-bold text-[#1F1A17]">Table #01 — Scan to Order</p>
        <p id="qr-url-preview" class="text-[10px] text-stone-400 break-all mt-1 max-w-[240px]"></p>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="downloadQR()" class="bg-[#1F1A17] text-white text-xs font-semibold py-2.5 rounded-xl hover:bg-stone-800 transition">
          Download PNG
        </button>
        <button onclick="window.print()" class="bg-amber-500 text-[#1F1A17] text-xs font-bold py-2.5 rounded-xl hover:bg-amber-400 transition">
          Print Table Card
        </button>
      </div>
    </div>
  </div>

  <!-- Order Tray Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-6 shadow-2xl max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-stone-200 pb-3">
        <div>
          <h2 class="font-serif-display text-xl font-bold">Your Table Order</h2>
          <p class="text-xs text-stone-500" id="modal-table-info">Ordering for Table #01</p>
        </div>
        <button onclick="closeCartModal()" class="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
      </div>

      <div id="cart-items-list" class="py-3 overflow-y-auto flex-1 space-y-3"></div>

      <div class="
